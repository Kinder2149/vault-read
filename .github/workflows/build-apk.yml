name: Build APK de test

# Fabrique un APK de DEBUG (non signe pour le Play Store, installable
# directement sur un telephone) a chaque mise a jour d'une branche de travail,
# et le rend telechargeable depuis l'onglet Actions de GitHub.

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Le SDK Android est deja installe sur les machines GitHub
      # (ANDROID_HOME preconfigure) ; Gradle telecharge lui-meme la plateforme
      # et les build-tools manquants. `android-actions/setup-android` tentait
      # en plus d'installer le paquet "tools", que Google ne distribue plus
      # depuis longtemps, et faisait echouer le build pour rien.

      - name: Installer les dependances
        run: npm ci

      - name: Construire le web et synchroniser Android
        run: npm run android

      - name: Construire l'APK de debug
        working-directory: client/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: vault-read-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
